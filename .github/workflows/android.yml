# Android CI — her itmede test koşar ve indirilebilir APK üretir.
#
# APK'lar iş özetindeki "Artifacts" bölümünden inilir (30 gün saklanır).
# Sürüm etiketiyle (v1.2.3) yapılan yayınlar için `release.yml`'e bakın.
name: Android

# push yalnız main'i dinler: PR'lı bir dalda hem push hem pull_request
# tetiklenip aynı işi iki kez koşturuyordu. PR'sız bir daldan APK almak
# için workflow_dispatch ile elle tetiklenebilir.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "data/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "data/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# Aynı dala arka arkaya itme yapılırsa eski koşuyu iptal et.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          # versionCode commit sayısından türetiliyor; sığ klonda sayı yanlış çıkar.
          fetch-depth: 0

      - name: Gradle wrapper'ı doğrula
        uses: gradle/actions/wrapper-validation@v6

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Yalnız platform-tools: android-37 platformu sdkmanager'ın koşucu
          # kanalında henüz listelenmiyor; AGP eksik platformu derleme
          # sırasında kendi depo çözümlemesiyle indiriyor.
          packages: "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Önbelleği yalnız ana dal yazsın; dal derlemeleri onu okur.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Sürüm numaralarını hesapla
        id: version
        run: |
          # Commit sayısı monoton artar ve CI koşu sayacından bağımsızdır:
          # aynı commit her zaman aynı versionCode'u verir.
          code=$(git rev-list --count HEAD)
          name="1.0.0-ci.${code}-$(git rev-parse --short HEAD)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "APK sürümü: $name (versionCode $code)"

      - name: İmza anahtarını çöz
        # Secret tanımlıysa her itişin APK'sı da yayın anahtarıyla imzalanır —
        # artifact'tan inen APK, Releases'tekiyle aynı imzayı taşır ve üstüne
        # kurulur. Secret yoksa dosya oluşmaz; Gradle debug anahtarına düşer.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radyola-release.jks"
            echo "signed=true" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_ENV"
          fi

      - name: Birim testleri
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: APK'ları derle
        working-directory: android
        env:
          RADYOLA_KEYSTORE_FILE: ${{ runner.temp }}/radyola-release.jks
          RADYOLA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADYOLA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RADYOLA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleDebug assembleRelease
          -Pradyola.versionCode=${{ steps.version.outputs.code }}
          -Pradyola.versionName=${{ steps.version.outputs.name }}

      - name: APK'ları topla
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/radyola-${{ steps.version.outputs.name }}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/radyola-${{ steps.version.outputs.name }}-release.apk"
          ls -lh artifacts/

      - name: APK'ları yükle
        uses: actions/upload-artifact@v7
        with:
          name: radyola-apk-${{ steps.version.outputs.name }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Test raporları (yalnız başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-raporlari-${{ github.run_number }}
          path: android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Özet
        if: always()
        run: |
          {
            echo "### Radyola Android"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${{ steps.version.outputs.name }}\` |"
            echo "| versionCode | \`${{ steps.version.outputs.code }}\` |"
            if [ "$signed" = "true" ]; then
              echo "| İmza | Yayın anahtarı |"
            else
              echo "| İmza | Debug anahtarı |"
            fi
            echo
            echo "APK'lar bu koşunun **Artifacts** bölümünde."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (bilgilendirme)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Lint bulguları derlemeyi düşürmesin; rapor artifact olarak inilir.
    # Bulgular temizlendikten sonra bu satır kaldırılıp zorunlu hâle getirilebilir.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Yalnız platform-tools: android-37 platformu sdkmanager'ın koşucu
          # kanalında henüz listelenmiyor ("Failed to find package") ama AGP,
          # lisanslar kabul edilmiş olduğu için eksik platformu derleme
          # sırasında kendi depo çözümlemesiyle indiriyor.
          packages: "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Lint raporu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-raporu-${{ github.run_number }}
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
