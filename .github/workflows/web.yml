# Web CI + GitHub Pages dağıtımı — GitLab Pages'in karşılığı.
#
# Derleme her PR'da koşar; dağıtım yalnız main'e itmede ve elle tetiklemede.
# Yayınlanan ağaç GitLab'daki `public/` ile birebir aynı: index.html,
# radyola.svg, radyola-player.css, dist/ ve data/*.json. Beş platformun tamamı
# istasyon listesini bu sitedeki `data/` yolundan çekiyor.
#
# Pages'i elle açmak gerekmez: ilk dağıtımda configure-pages (enablement)
# siteyi "GitHub Actions" kaynağıyla kendisi açar.
#
# Özel alan adı: DNS kaydı GitHub Pages'e yönlendikten sonra depo değişkeni
# tanımlayın — Settings → Secrets and variables → Actions → Variables:
#   PAGES_CUSTOM_DOMAIN = radyola.aripd.com
# Değişken tanımlı değilken site https://<kullanıcı>.github.io/radyola/
# adresinden yayınlanır; böylece DNS taşınmadan önce yayın kesilmez.
name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR derlemelerinde üst üste binen koşunun eskisi iptal edilir; dağıtımlar
# asla iptal edilmez, sıraya girer.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Derle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      - name: Birim testleri
        working-directory: web
        run: npm test

      - name: Derle
        working-directory: web
        run: npm run build

      - name: public/ ağacını kur
        run: |
          mkdir -p public/data
          cp web/index.html web/radyola.svg web/radyola-player.css public/
          cp web/manifest.webmanifest web/sw.js public/
          cp -r web/icons web/fonts public/
          cp -r web/dist public/
          cp data/*.json public/data/
          # Service worker her dağıtımda commit'le damgalanır: baytları değişir,
          # tarayıcı yeni SW'yi kurar, install taze kabuğu indirir.
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" public/sw.js
          grep -m1 'const VERSION' public/sw.js
          find public -type f | sort

      - name: Özel alan adı
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        run: echo "${{ vars.PAGES_CUSTOM_DOMAIN }}" > public/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Pages'e yayınla
    needs: build
    # PR'da yalnız derleme yapılır; dağıtım main'e itmede ya da elle tetiklemede.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pages'i yapılandır (kapalıysa aç)
        uses: actions/configure-pages@v6
        with:
          # Site depoda hiç açılmamışsa ilk koşuda "GitHub Actions" kaynağıyla
          # açılır; Settings → Pages'te elle bir şey seçmek gerekmez.
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
