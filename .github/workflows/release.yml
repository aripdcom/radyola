# Sürüm yayını — `v` ile başlayan bir etiket itildiğinde çalışır.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Sonuç: bir GitHub Release — apk işi Release'i oluşturup APK'yı ekler,
# ardından linux/windows/macos işleri kendi paketlerini (.deb, .exe,
# macOS .zip) aynı Release'e yükler.
#
# İmzalama: aşağıdaki secret'lar tanımlıysa kendi anahtarınızla, tanımlı
# değilse debug anahtarıyla imzalanır (yan yükleme yine çalışır, fakat her
# koşuda farklı bir imza üretilir — kurulu uygulamanın üzerine yazılamaz).
#
#   ANDROID_KEYSTORE_BASE64   base64 -w0 radyola-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Yayın

on:
  push:
    tags: ["v*"]
  # Elle sürüm: etiket henüz yoksa gh release create onu da oluşturur.
  # Bu oturumdaki gibi git üzerinden etiket itemeyen ortamlar için de tek yol.
  workflow_dispatch:
    inputs:
      tag:
        description: "Sürüm etiketi (örn. v1.0.0)"
        required: true
        type: string

env:
  # Etiket itmede ref adı, elle tetiklemede girdi.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write # GitHub Release oluşturmak için

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: İmzalı APK ve Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gradle wrapper'ı doğrula
        uses: gradle/actions/wrapper-validation@v6

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Yalnız platform-tools: android-37 platformu sdkmanager'ın koşucu
          # kanalında henüz listelenmiyor ("Failed to find package") ama AGP,
          # lisanslar kabul edilmiş olduğu için eksik platformu derleme
          # sırasında kendi depo çözümlemesiyle indiriyor.
          packages: "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Sürümü etiketten al
        id: version
        run: |
          tag="$RELEASE_TAG"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: İmza anahtarını çöz
        # Secret tanımlı değilse dosya oluşmaz; Gradle debug anahtarına düşer.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radyola-release.jks"
            echo "signed=true" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 tanımlı değil — APK debug anahtarıyla imzalanacak."
            echo "signed=false" >> "$GITHUB_ENV"
          fi

      - name: Birim testleri
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Release APK
        working-directory: android
        env:
          RADYOLA_KEYSTORE_FILE: ${{ runner.temp }}/radyola-release.jks
          RADYOLA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADYOLA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RADYOLA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RADYOLA_VERSION_CODE: ${{ steps.version.outputs.code }}
          RADYOLA_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease

      - name: APK'yı adlandır
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/radyola-${{ steps.version.outputs.name }}.apk"
          ( cd artifacts && sha256sum *.apk > SHA256SUMS.txt )
          cat artifacts/SHA256SUMS.txt

      - name: Sürüm notlarını hazırla
        run: |
          # Elle tetiklemede etiket henüz oluşmadı; aralıklar HEAD üzerinden
          # kurulur (etiket itmede HEAD zaten etiketlenen commit).
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          v="${{ steps.version.outputs.name }}"
          {
            echo "## Radyola ${v}"
            echo
            echo "Çoklu platform internet radyo çalar — bu sürümün paketleri:"
            echo
            echo "| Paket | Platform | Kurulum |"
            echo "|---|---|---|"
            echo "| \`radyola-${v}.apk\` | Android 7.0+ | İndirip açın; bilinmeyen kaynaklardan kuruluma izin verin |"
            echo "| \`radyola-${v}-linux-all.deb\` | Debian / Ubuntu | \`sudo apt install ./radyola-${v}-linux-all.deb\` |"
            echo "| \`radyola-${v}-windows.exe\` | Windows 10+ | Çift tıklayın; SmartScreen uyarısında **Ek bilgi → Yine de çalıştır** |"
            echo "| \`radyola-${v}-macos.zip\` | macOS 14+ | Zip'i açıp Applications'a taşıyın; ilk açılışta **sağ tık → Aç** |"
            echo
            echo "🌐 Web sürümü kurulum gerektirmez: https://aripdcem.github.io/radyola/"
            echo
            echo "Her paketin yanında \`.sha256\` özeti var; APK'nınki \`SHA256SUMS.txt\` içinde."
            echo "Paketler ayrı işlerce derlenir — hepsi birkaç dakika içinde tamamlanır."
            echo
            if [ "$signed" = "true" ]; then
              echo "Android paketi yayın anahtarıyla imzalı (versionCode \`${{ steps.version.outputs.code }}\`)."
            else
              echo "Android paketi debug anahtarıyla imzalı — yalnız yan yükleme içindir"
              echo "(versionCode \`${{ steps.version.outputs.code }}\`). Windows ve macOS"
              echo "paketleri imzasızdır; ilk açılış uyarıları bundandır."
            fi
            if [ -n "$previous" ]; then
              echo
              echo "**Değişiklikler:** $previous...${{ steps.version.outputs.tag }}"
              echo
              git log --pretty='- %s' "$previous..HEAD"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Release oluştur ya da güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # Aynı etiket yeniden tetiklenirse iş düşmesin: var olan Release'in
          # notları güncellenir, paketler --clobber ile tazelenir.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Radyola ${{ steps.version.outputs.name }}" \
              --notes-file release-notes.md
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Radyola ${{ steps.version.outputs.name }}" \
              --notes-file release-notes.md
          fi
          gh release upload "$tag" --clobber \
            "artifacts/radyola-${{ steps.version.outputs.name }}.apk" \
            artifacts/SHA256SUMS.txt

  # ── Diğer platform paketleri ─────────────────────────────
  # Üç iş de Release oluştuktan sonra koşar ve dosyasını ona ekler.
  # Biri düşerse diğerleri etkilenmez; Release eksik platformla kalır ve iş
  # kırmızı görünür — yeniden koşturmak eksiği tamamlar.

  linux-deb:
    name: Linux .deb
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: DEB paketini derle
        working-directory: linux
        run: bash build-deb.sh

      - name: Release'e ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          cp linux/radyola_*_all.deb "radyola-${version}-linux-all.deb"
          sha256sum "radyola-${version}-linux-all.deb" > "radyola-${version}-linux-all.deb.sha256"
          gh release upload "$RELEASE_TAG" --clobber \
            "radyola-${version}-linux-all.deb" \
            "radyola-${version}-linux-all.deb.sha256"

  windows-exe:
    name: Windows .exe
    needs: apk
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: EXE derle
        shell: bash
        run: |
          python -m pip install --upgrade pyinstaller pystray Pillow pygame
          cd windows
          pyinstaller --onefile --windowed --name Radyola \
            --hidden-import=pystray._win32 --hidden-import=PIL --hidden-import=pygame \
            radyola.py

      - name: Release'e ekle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          cp windows/dist/Radyola.exe "radyola-${version}-windows.exe"
          sha256sum "radyola-${version}-windows.exe" > "radyola-${version}-windows.exe.sha256"
          gh release upload "$RELEASE_TAG" --clobber \
            "radyola-${version}-windows.exe" \
            "radyola-${version}-windows.exe.sha256"

  macos-app:
    name: macOS .app
    needs: apk
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Derle (imzasız)
        # Apple geliştirici sertifikası yok; ilk açılışta sağ tık → Aç gerekir.
        run: >
          xcodebuild
          -project macosx/Radyola.xcodeproj
          -target Radyola
          -configuration Release
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Release'e ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          ditto -c -k --keepParent macosx/build/Release/Radyola.app "radyola-${version}-macos.zip"
          shasum -a 256 "radyola-${version}-macos.zip" > "radyola-${version}-macos.zip.sha256"
          gh release upload "$RELEASE_TAG" --clobber \
            "radyola-${version}-macos.zip" \
            "radyola-${version}-macos.zip.sha256"
